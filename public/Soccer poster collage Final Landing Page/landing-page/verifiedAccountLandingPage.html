<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to the JOGO movement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0E0F0D;
    font-family: 'Archivo', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .frame {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Fixed 1080x1080 stage, scaled to fit the viewport and centered */
  .stage {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: #0E0F0D;
    flex: none;
    transform: scale(var(--s, 1));
    transform-origin: center center;
  }
  .logo {
    position: absolute; top: 38px; left: 50%; transform: translateX(-50%);
    z-index: 40; width: 101px; height: 101px; display: block;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4));
  }
  .est {
    position: absolute; top: 52px; right: 48px; z-index: 40;
    font-weight: 700; font-size: 15px; letter-spacing: 3px; color: #B6F03C;
  }
  .collage {
    position: absolute; inset: 34px 0 0 0; z-index: 10; transform: scale(0.9);
  }
  .pic {
    position: absolute; display: block; object-fit: cover;
    border: 5px solid #B6F03C; box-shadow: 0 12px 30px rgba(0,0,0,0.55);
  }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 30;
    text-align: center; padding: 44px 48px; box-sizing: border-box;
    background: linear-gradient(to top, #0E0F0D 58%, rgba(14,15,13,0.85) 78%, rgba(14,15,13,0) 100%);
  }
  .caption h1 {
    margin: 0;
    font-family: 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 900; color: #F7F6F1; font-size: 58px; line-height: 0.95; letter-spacing: -1px;
  }
  .caption h1 img { height: 74px; width: auto; vertical-align: middle; margin: 0 10px 4px; }
  .caption p {
    margin: 14px auto 0; color: #c9cabf; font-weight: 500;
    font-size: 22px; line-height: 1.35; max-width: 640px;
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0E0F0D"/>
      <circle cx="50" cy="42" r="20" fill="none" stroke="#B6F03C" stroke-width="4"/>
      <text x="50" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#B6F03C" text-anchor="middle">j</text>
      <text x="50" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#F7F6F1" text-anchor="middle">JOGO</text>
    </svg>
  </template>
  <div class="frame">
    <div class="stage" id="stage">
      <img class="logo" src="uploads/newIcon-final.png" alt="JOGO">
      <div class="est">EST. 2026</div>

      <div class="collage">
        <img class="pic" src="photos/web/pic2.jpg"  style="width:520px; height:388px; left:540px; top:452px; transform:translate(-50%,-50%) rotate(-3deg);  z-index:2;">
        <img class="pic" src="photos/web/pic1.jpg"  style="width:472px; height:407px; left:378px; top:384px; transform:translate(-50%,-50%) rotate(-9deg);  z-index:4;">
        <img class="pic" src="photos/web/pic9.jpg"  style="width:460px; height:345px; left:698px; top:416px; transform:translate(-50%,-50%) rotate(8deg);   z-index:3;">
        <img class="pic" src="photos/web/pic6.jpg"  style="width:270px; height:385px; left:298px; top:332px; transform:translate(-50%,-50%) rotate(-14deg); z-index:5;">
        <img class="pic" src="photos/web/pic4.jpg"  style="width:262px; height:372px; left:566px; top:328px; transform:translate(-50%,-50%) rotate(3deg);   z-index:6;">
        <img class="pic" src="photos/web/pic7.jpg"  style="width:274px; height:390px; left:766px; top:312px; transform:translate(-50%,-50%) rotate(12deg);  z-index:6;">
        <img class="pic" src="photos/web/pic10.jpg" style="width:440px; height:330px; left:566px; top:634px; transform:translate(-50%,-50%) rotate(-5deg);  z-index:7;">
        <img class="pic" src="photos/web/pic3.jpg"  style="width:300px; height:428px; left:344px; top:594px; transform:translate(-50%,-50%) rotate(-8deg);  z-index:8;">
        <img class="pic" src="photos/web/pic5.jpg"  style="width:282px; height:402px; left:498px; top:576px; transform:translate(-50%,-50%) rotate(4deg);   z-index:10;">
        <img class="pic" src="photos/web/pic8.jpg"  style="width:288px; height:388px; left:726px; top:626px; transform:translate(-50%,-50%) rotate(9deg);   z-index:9;">
      </div>

      <div class="caption">
        <h1>WELCOME TO THE <img src="photos/jogo-green.png" alt="jogo"> MOVEMENT</h1>
        <p>You can return to the JOGO app and start creating your profile.</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      function fit() {
        var s = Math.min(window.innerWidth, window.innerHeight) / 1080;
        stage.style.setProperty('--s', s);
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
